.hsrch{margin-left:auto;display:flex;align-items:center;gap:6px;appearance:none;border:1px solid color-mix(in srgb,var(--violet) 30%,transparent);background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer;min-height:36px}
.hsrch svg{width:17px;height:17px}
#sdlg{align-self:start;margin-top:10px}
#sq{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.sres .sg{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);margin:12px 4px 6px}
.sres button{display:block;width:100%;text-align:left;appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:10px 12px;border-radius:12px;margin:0 0 6px;cursor:pointer}
.sres button b{display:block;font-size:15px}.sres button small{display:block;color:var(--ink2);font-size:13px;margin-top:2px;line-height:1.35}
.sres mark{background:color-mix(in srgb,var(--violet) 22%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.sres .sv{color:var(--ink2);font-size:14px;padding:8px 4px}
.offc{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;margin:0 0 12px}
.offc > div{flex:1;min-width:0}.offc p{margin:4px 0 0}
.offc .btn{flex:none}
.offbar{height:8px;border-radius:99px;background:var(--seg);margin-top:8px;overflow:hidden}
.offbar i{display:block;height:100%;width:0;background:var(--violet);transition:width .2s}
@media (min-width:1100px){
  body.split .wrap{margin-left:max(24px,calc((100vw - min(680px,48vw) - 760px) / 2));margin-right:0;max-width:min(760px,calc(100vw - min(680px,48vw) - 48px))}
  body.split #dlg{position:fixed;inset:0 0 0 auto;margin:0;height:100dvh;max-height:100dvh;width:min(680px,48vw);border-radius:0;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.08);z-index:20;overflow:auto}
}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{display:flex;flex-direction:column;gap:12px;padding:16px}
.dlgh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dlgh h3{margin:0;font-size:21px;line-height:1.2}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px}
@media (max-width:420px){.seg button{font-size:12.5px;padding:10px 2px}.step .q{font-size:18px}}
.mec{display:grid;gap:10px}.mec p,.mec ul{margin:0}.mec ul{padding-left:18px;display:grid;gap:6px}
#visor{position:fixed;inset:0;z-index:1000;background:#000;display:flex;flex-direction:column}
#visor[hidden]{display:none}
#visor .vbar{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:#111}
#visor .vbar button{background:#2c2c2e;color:#fff;border:0;border-radius:12px;font:600 17px var(--font);min-width:48px;height:44px;padding:0 14px}
#visor .vbar .vx{background:#fff;color:#000;margin-left:auto}
#visor .vbox{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:flex-start;justify-content:flex-start;touch-action:pan-x pan-y}
#visor .vbox img{display:block;margin:auto;max-width:none;background:#fff}

/* ---------- motion graphics sobre el esquema actual ---------- */
.mg .anpanel:only-child{max-width:560px}
.mg svg.anh{transition:none;transform:perspective(1400px) rotateX(var(--rx,4deg)) rotateY(var(--ry,-5deg));transform-origin:50% 60%;box-shadow:0 22px 40px -18px rgba(60,20,40,.45);background:radial-gradient(circle at 45% 35%,#fff,#f4ecef 70%,#eadde2)}
.mg .heartg{transform-box:fill-box;transform-origin:50% 55%;filter:drop-shadow(0 10px 14px rgba(90,30,30,.35))}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero"><div class="hicon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h3l1.5-4 2 8 1.5-4h2"/><path d="M14 6v12M17 9v6M20 6v12"/></svg></div><h1>Prototipo 2,5D</h1></header>
  <p class="small" style="margin:0">Sobreestimulación ventricular en la TRAV, con el mismo esquema de la app y efectos de movimiento: profundidad, brillo y estela de los frentes, contracción de las cámaras y una cámara que se acerca a la zona clave en cada fase.</p>
  <div class="box anim mg" data-anim="vop_0"></div>
  <p class="small" style="opacity:.7;margin:0">Prototipo para comparar estilos. Tiempos ilustrativos.</p>
</div>
<script src="../anim.js"></script>
<script>
(function () {
  const root = document.querySelector('.anim'); mountAnims(document);
  const svg = root.querySelector('svg.anh'), rng = root.querySelector('.ant');
  const NS = 'http://www.w3.org/2000/svg';
  // brillo para los frentes y la estela
  const defs = document.createElementNS(NS, 'defs');
  defs.innerHTML = '<filter id="mgGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'
    + '<radialGradient id="mgLight" cx="35%" cy="25%" r="80%"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></radialGradient>';
  svg.insertBefore(defs, svg.firstChild);
  const heartG = svg.querySelector(':scope > g'); heartG.classList.add('heartg');
  const dots = svg.lastElementChild; dots.setAttribute('filter', 'url(#mgGlow)');
  // luz y sombra sobre el corazón (volumen)
  const shade = document.createElementNS(NS, 'rect'); shade.setAttribute('x', 15); shade.setAttribute('y', 50); shade.setAttribute('width', 560); shade.setAttribute('height', 652); shade.setAttribute('fill', 'url(#mgLight)'); shade.setAttribute('pointer-events', 'none');
  svg.insertBefore(shade, heartG.nextSibling);
  // cámara: [momento, centro x, centro y, ancho visible]
  const FULL = [295, 376, 560];
  const SHOTS = [[0, ...FULL], [650, ...FULL], [950, 330, 470, 400], [2000, 330, 470, 400], [2250, 380, 255, 360], [2850, 380, 255, 360], [3150, ...FULL]];
  const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
  const ven = [...svg.querySelectorAll('path')].filter(p => p.getAttribute('fill') === '#ff9800');
  let cx = FULL[0], cy = FULL[1], w = FULL[2], t0 = performance.now();
  function tick(now) {
    const T = +rng.value;
    let i = 0; while (i < SHOTS.length - 2 && T >= SHOTS[i + 1][0]) i++;
    const [a0, x0, y0, w0] = SHOTS[i], [a1, x1, y1, w1] = SHOTS[i + 1], f = ease(Math.max(0, Math.min(1, (T - a0) / Math.max(1, a1 - a0))));
    const tx = x0 + (x1 - x0) * f, ty = y0 + (y1 - y0) * f, tw = w0 + (w1 - w0) * f;
    cx += (tx - cx) * .12; cy += (ty - cy) * .12; w += (tw - w) * .12;
    const h = w * 652 / 560; svg.setAttribute('viewBox', `${cx - w / 2} ${cy - h * .48} ${w} ${h}`);
    // contracción ventricular al activarse
    const lv = Math.max(0, ...ven.map(p => +(p.getAttribute('opacity') || 0)));
    heartG.style.transform = `scale(${1 - .045 * (lv / .3)})`;
    // leve balanceo de la perspectiva
    const s = (now - t0) / 1000; svg.style.setProperty('--ry', (-5 + 2.5 * Math.sin(s * .6)) + 'deg'); svg.style.setProperty('--rx', (4 + 1.5 * Math.sin(s * .45)) + 'deg');
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
